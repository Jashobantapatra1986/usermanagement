spring:
  application:
    name: usermanagement-ms
  webflux:
    base-path: /usermanagement-ms
  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/usermanagement?createDatabaseIfNotExist=true}
    user: ${DB_USERNAME:jasho}
    password: ${DB_PASSWORD:password}
  r2dbc:
    url: ${R2DBC_URL:r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/usermanagement}
    username: ${DB_USERNAME:jasho}
    password: ${DB_PASSWORD:password}

server:
  port: ${SERVER_PORT:8123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
